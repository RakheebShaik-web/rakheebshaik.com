<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Speech bubble body -->
  <rect x="4" y="4" width="40" height="28" rx="3" fill="#ffe97a" stroke="#000" stroke-width="2"/>
  <!-- Tail -->
  <polygon points="12,32 20,40 24,32" fill="#ffe97a" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Cover tail-bubble overlap -->
  <rect x="12" y="30" width="13" height="3" fill="#ffe97a"/>
  <!-- Text lines -->
  <line x1="12" y1="14" x2="36" y2="14" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="20" x2="32" y2="20" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="26" x2="28" y2="26" stroke="#000" stroke-width="2" stroke-linecap="round"/>
</svg>
